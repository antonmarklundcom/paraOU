name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    # Dockerized Postgres with pgvector for the migration + integration tests
    # (CLAUDE.md rule 7, PHASE-1 acceptance).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: paraou
          POSTGRES_PASSWORD: paraou
          POSTGRES_DB: paraou
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paraou -d paraou"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://paraou:paraou@localhost:5432/paraou
      AUTH_SECRET: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      # Verifies the DB produced by the migrations matches the migration history —
      # our drift gate. (A strict `migrate diff --exit-code` can't model the pgvector
      # / generated-tsvector raw SQL; see prisma/migrations. Documented in README.)
      - name: Check migration status
        run: npx prisma migrate status

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (units + Postgres integration)
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: paraou
          POSTGRES_PASSWORD: paraou
          POSTGRES_DB: paraou
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paraou -d paraou"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://paraou:paraou@localhost:5432/paraou
      NEXT_PUBLIC_APP_URL: http://localhost:3210
      AUTH_SECRET: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e (browse → filter → detail → .ics)
        run: npm run e2e
