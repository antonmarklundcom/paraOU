# Production overlay for the Hostinger VPS (PHASE-6 #6 launch checklist).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --profile app up -d --build
#
# Adds: Caddy (automatic HTTPS via Let's Encrypt) and a one-shot migration
# runner.
# Requires Docker Compose >= 2.24 (`!reset` tag). Set POSTGRES_PASSWORD in the
# shell or in .env (use a URL-safe value, e.g. `openssl rand -hex 24`): it is
# required here and also used in the DATABASE_URL of web/worker/migrate.
# The base file publishes db on 127.0.0.1:5432 for local dev; Compose MERGES
# `ports:` lists across files, so this overlay clears it with `!reset []` -
# the db is then reachable only on the Docker network (Docker-published ports
# bypass UFW, so a firewall rule alone would not protect it).

services:
  db:
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports: !reset []

  migrate:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://paraou:${POSTGRES_PASSWORD}@db:5432/paraou
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    restart: always
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    restart: always
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy:
    profiles: ["app"]
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
